name: Publishing validation

on:
  pull_request:
    paths:
      - custom_components/**
      - hacs.json
      - .github/workflows/publish-validation.yml
  push:
    branches: [main]
    paths:
      - custom_components/**
      - hacs.json
      - .github/workflows/publish-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate HACS and Marketplace packaging
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration metadata
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
