name: Provider compatibility

on:
  pull_request:
    paths:
      - custom_components/**
      - tests/provider_contract/**
      - tests/conftest.py
      - pyproject.toml
      - tests/test_provider_release.py
      - scripts/provider_release.py
      - provider-compatibility.json
      - requirements*.txt
      - .github/workflows/provider-compatibility.yml
  push:
    branches: [main]
    paths:
      - custom_components/**
      - tests/provider_contract/**
      - tests/conftest.py
      - pyproject.toml
      - tests/test_provider_release.py
      - scripts/provider_release.py
      - provider-compatibility.json
      - requirements*.txt
      - .github/workflows/provider-compatibility.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Provider to test
        type: choice
        options: [baseline, latest-release, upstream-main]
        default: baseline
      force:
        description: Retest cached or known-unsupported builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provider-compatibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.target.outputs.repository }}
      ref: ${{ steps.target.outputs.ref }}
      label: ${{ steps.target.outputs.label }}
      target: ${{ steps.target.outputs.target }}
      known_unsupported: ${{ steps.target.outputs.known_unsupported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve an immutable provider revision
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER_TARGET: ${{ github.event_name == 'schedule' && 'latest-release' || inputs.target || 'baseline' }}
        run: python scripts/provider_release.py --target "$PROVIDER_TARGET" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  contract:
    needs: resolve
    if: needs.resolve.outputs.known_unsupported != 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HA_STRAVA_SOURCE: ${{ github.workspace }}/.compat/provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this provider/code combination already passed
        id: passed
        if: needs.resolve.outputs.target != 'baseline' && !inputs.force
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compat/passed
          key: provider-${{ needs.resolve.outputs.label }}-${{ needs.resolve.outputs.ref }}-${{ hashFiles('custom_components/**', 'tests/provider_contract/**', 'tests/conftest.py', 'pyproject.toml', 'scripts/provider_release.py', 'provider-compatibility.json', 'requirements*.txt', '.github/workflows/provider-compatibility.yml') }}
      - name: Check out the real provider
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: .compat/provider
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-provider-test.txt
            .compat/provider/custom_components/ha_strava/manifest.json
      - name: Install both integrations' dependencies
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          python -c 'import json,pathlib; p=pathlib.Path(".compat/provider/custom_components/ha_strava/manifest.json"); pathlib.Path(".compat/provider-requirements.txt").write_text("\n".join(json.loads(p.read_text())["requirements"]))'
          python -m pip install -r requirements-dev.txt -r requirements-provider-test.txt -r .compat/provider-requirements.txt
      - name: Exercise real provider and companion contracts
        id: suite
        if: steps.passed.outputs.cache-hit != 'true'
        run: python -m pytest tests/provider_contract -q --junitxml=.compat/provider-results.xml
      - name: Record a passing result
        if: success() && steps.suite.outcome == 'success' && needs.resolve.outputs.target != 'baseline'
        run: mkdir -p .compat/passed && touch .compat/passed/success
      - name: Cache successful compatibility only
        if: success() && steps.suite.outcome == 'success' && needs.resolve.outputs.target != 'baseline'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compat/passed
          key: provider-${{ needs.resolve.outputs.label }}-${{ needs.resolve.outputs.ref }}-${{ hashFiles('custom_components/**', 'tests/provider_contract/**', 'tests/conftest.py', 'pyproject.toml', 'scripts/provider_release.py', 'provider-compatibility.json', 'requirements*.txt', '.github/workflows/provider-compatibility.yml') }}
      - name: Report result and provenance
        if: always()
        env:
          PROVIDER_LABEL: ${{ needs.resolve.outputs.label }}
          PROVIDER_REF: ${{ needs.resolve.outputs.ref }}
          CACHE_HIT: ${{ steps.passed.outputs.cache-hit }}
          OUTCOME: ${{ steps.suite.outcome }}
        run: |
          printf '## Provider contract result\n\n%s (`%s`)\n\n' "$PROVIDER_LABEL" "$PROVIDER_REF" >> "$GITHUB_STEP_SUMMARY"
          printf 'Test outcome: %s. Previously passed cache: %s.\n' "$OUTCOME" "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
