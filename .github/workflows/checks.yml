name: Checks

on:
  pull_request:
    paths:
      - custom_components/**
      - blueprints/**
      - examples/**
      - tests/**
      - requirements-dev.txt
      - pyproject.toml
      - hacs.json
      - .github/workflows/checks.yml
  push:
    branches-ignore: [main]
    paths:
      - custom_components/**
      - blueprints/**
      - examples/**
      - tests/**
      - requirements-dev.txt
      - pyproject.toml
      - hacs.json
      - .github/workflows/checks.yml

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=custom_components.ha_strava_automation --cov-report=term-missing --cov-fail-under=90

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate HACS and Marketplace packaging
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration metadata
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
