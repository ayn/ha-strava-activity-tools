[project]
name = "ha-strava-automation"
version = "0.7.3"
description = "Independent Home Assistant integration for Strava automations"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
