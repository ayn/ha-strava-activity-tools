[project]
name = "ha-strava-activity-tools"
version = "0.6.1"
description = "Home Assistant companion for Strava activity automations"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
